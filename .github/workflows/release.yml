name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to publish again after a failure (e.g. v0.4.0). Leave empty to update the release PR.'
        required: false
        type: string

permissions:
  contents: read

# Never interrupt a publication; serialize PR updates and manual recovery too.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: validate
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [validate, release]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      (needs.release.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Validate stable tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v0.4.0' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub release and default-branch ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          node -e "const r = require(process.env.RUNNER_TEMP + '/release.json'); if (r.isDraft || r.isPrerelease || r.tagName !== process.env.RELEASE_TAG) throw new Error('Expected a published stable GitHub release')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate package identity and registry state
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (pkg.name !== 'easy-spotify-ts' || `v${pkg.version}` !== process.env.RELEASE_TAG || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Package name, version, lockfile and release tag must agree')
          }
          const repository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}`
          if (pkg.repository.url.replace(/\.git$/, '') !== repository) throw new Error('Package repository must match the publishing repository')
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}`, { signal: AbortSignal.timeout(30000) })
          let published = false
          if (response.ok) {
            const metadata = await response.json()
            published = Boolean(metadata.versions?.[pkg.version])
            const latest = metadata['dist-tags']?.latest
            if (!published && latest) {
              const compare = (a, b) => {
                const x = a.split('.').map(Number), y = b.split('.').map(Number)
                for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]
                return 0
              }
              if (!/^\d+\.\d+\.\d+$/.test(latest) || compare(pkg.version, latest) <= 0) throw new Error('Refusing to move latest backwards or publish over an equal version')
            }
          } else if (response.status !== 404) {
            throw new Error(`Registry lookup failed: HTTP ${response.status}`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, published ? `Version ${pkg.version} already exists on npm; publication skipped.\n` : `Publishing ${pkg.name}@${pkg.version} from ${process.env.RELEASE_TAG}.\n`)
          NODE
      - if: steps.registry.outputs.published != 'true'
        run: npm ci
      - name: Validate the exact release source
        if: steps.registry.outputs.published != 'true'
        run: npm run check
      - name: Pack the validated release
        if: steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node -e "const fs = require('node:fs'); const [p] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json')); for (const file of ['dist/index.js', 'dist/index.d.ts', 'dist/PlaylistSync.js', 'dist/PlaylistSync.d.ts']) if (!p.files.some(f => f.path === file)) throw new Error('Missing package file: ' + file); fs.appendFileSync(process.env.GITHUB_ENV, 'NPM_TARBALL=' + p.filename + '\n')"
      - name: Publish validated tarball using npm trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish "$NPM_TARBALL" --access public --tag latest --ignore-scripts

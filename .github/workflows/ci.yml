name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
      - name: Inspect publishable files without repeating prepack checks
        run: npm pack --dry-run --ignore-scripts
      - name: Verify built CommonJS and ESM exports
        run: |
          node -e "const { EasySpotify, EasySpotifyConfig, PlaylistSync } = require('./dist'); if (!new EasySpotify(new EasySpotifyConfig('test')).playlists || !PlaylistSync) process.exit(1)"
          node --input-type=module -e "import { EasySpotify, EasySpotifyConfig, PlaylistSync } from './dist/index.js'; if (!new EasySpotify(new EasySpotifyConfig('test')).playlists || !PlaylistSync) process.exit(1)"
      - name: Upload coverage
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
